---
include:
  - component: $CI_SERVER_FQDN/csning1998-lab/gitlab-ci-with-code-reviewer/core@1.7.1
    inputs:
      reviewer_image: $CI_REGISTRY/csning1998-lab/gitlab-ci-with-code-reviewer/reviewer:1.7.1
      review_models:
        - "claude-sonnet-5"
        - "gemini-3.7-flash"
        - "azure-gpt-5.4-mini"
      enable_sonarqube: true
  - component: $CI_SERVER_FQDN/csning1998-lab/gitlab-ci-with-code-reviewer/iac-terraform@1.7.1
    inputs:
      # CKV_GLB_1, CKV_GLB_3, CKV_GLB_4: require GitLab Premium/Ultimate merge request approval and push rules.
      # CKV_TF_1: enforces commit-pinned Git URLs; modules use immutable semantic versions from GitLab Terraform Registry.
      checkov_skip: "CKV_GLB_1,CKV_GLB_3,CKV_GLB_4,CKV_TF_1"
  - component: $CI_SERVER_FQDN/csning1998-lab/gitlab-ci-with-code-reviewer/iac-ansible@1.7.1
    inputs:
      ansible_globs: ["ansible/**/*", "ansible.cfg"]
  - component: $CI_SERVER_FQDN/csning1998-lab/gitlab-ci-with-code-reviewer/lang-go@1.7.1
    inputs:
      go_dir: "tools/platform"
      go_fmt_path: "./tools/platform"
      go_globs:
        [
          "tools/platform/**/*.go",
          "tools/platform/go.mod",
          "tools/platform/go.sum",
        ]
  - component: $CI_SERVER_FQDN/csning1998-lab/gitlab-ci-with-code-reviewer/auto-tag@1.7.1
    inputs:
      reviewer_image: $CI_REGISTRY/csning1998-lab/gitlab-ci-with-code-reviewer/reviewer:1.7.1
      # Module publishing paused until terraform/modules/ gains an external consumer repository;
      # currently, layers reference modules by relative path.
      # - local: ".gitlab/ci/modules-terraform.yml"

# internal/libvirtops uses cgo bindings against libvirt.org/go/libvirt. The lang-go component's
# golang:*-alpine image ships CGO_ENABLED=0 and no libvirt headers by default; these overrides
# are local to meta-platform until ported into gitlab-ci-with-code-reviewer's lang-go.yml.
build:go:
  variables:
    CGO_ENABLED: "1"
    GOPRIVATE: "gitlab.com/csning1998-lab/parent-group-governance*"
  before_script:
    - apk add --no-cache git gcc musl-dev pkgconf libvirt-dev
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"

test:go:
  variables:
    CGO_ENABLED: "1"
    GOPRIVATE: "gitlab.com/csning1998-lab/parent-group-governance*"
  # The list replaces the before_script of the component, and the component installs gotestsum in the script.
  before_script:
    - apk add --no-cache git gcc musl-dev pkgconf libvirt-dev
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
    - go install gotest.tools/gotestsum@v1.13.0

lint:go:
  variables:
    CGO_ENABLED: "1"
    GOPRIVATE: "gitlab.com/csning1998-lab/parent-group-governance*"
  before_script:
    - apk add --no-cache git gcc musl-dev pkgconf libvirt-dev
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
