---
include:
  - component: $CI_SERVER_FQDN/csning1998/gitlab-ci-with-code-reviewer/core@1.4.0
    inputs:
      reviewer_image: $CI_REGISTRY/csning1998/gitlab-ci-with-code-reviewer/reviewer:1.4.0
      claude_model: claude-sonnet-5
      enable_sonarqube: true
  - component: $CI_SERVER_FQDN/csning1998/gitlab-ci-with-code-reviewer/iac-terraform@1.4.0
    inputs:
      # CKV_GLB_1, CKV_GLB_3, and CKV_GLB_4 require GitLab merge request approval rules and push rules.
      # Both features are gated to the Premium/Ultimate tiers and are unavailable to the Free tier group.
      checkov_skip: "CKV_GLB_1,CKV_GLB_3,CKV_GLB_4"
  - component: $CI_SERVER_FQDN/csning1998/gitlab-ci-with-code-reviewer/iac-terraform-module@1.4.0
    inputs:
      # Package Registry publishing is scoped to the project-baseline subdirectory rather than the repository root,
      # due to the coexistence of governance layers and the module within this repository.
      module_dir: "${CI_PROJECT_DIR}/modules/project-baseline"
      module_name: "project-baseline"
      module_system: "gitlab"
  - component: $CI_SERVER_FQDN/csning1998/gitlab-ci-with-code-reviewer/iac-terraform-module@1.4.0
    inputs:
      module_dir: "${CI_PROJECT_DIR}/modules/service-catalog"
      module_name: "service-catalog"
      module_system: "gitlab"
