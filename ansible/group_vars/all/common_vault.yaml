---
# Syatem Config
vault_target_os: "linux"
vault_target_arch: "amd64"
vault_target_version: "2.0.1"

# System Identity
vault_owner: vault
vault_group: vault

# Standard Directory Structure
vault_dir_config: "/etc/vault.d"
vault_dir_tls: "/etc/vault.d/tls"
vault_dir_data: "/opt/vault/data"

# Network Defaults
vault_port_api: 8200
vault_port_cluster: 8201

# PKI Defaults
vault_ca_subject_common_name: "Vault Root CA"
vault_cluster_name: "vault-ha-cluster"

# The operator Vault defaults to the Vault Proxy which vault-proxy-env selects. A layer which targets another Vault
# passes the URL and the CA path, and the Proxy client certificate stays empty there.
operator_vault_url: "{{ lookup('ansible.builtin.env', 'VAULT_ADDR') }}"
operator_vault_ca_cert_path: "{{ lookup('ansible.builtin.env', 'VAULT_CACERT') }}"
operator_vault_client_cert: "{{ lookup('ansible.builtin.env', 'VAULT_CLIENT_CERT') }}"
operator_vault_client_key: "{{ lookup('ansible.builtin.env', 'VAULT_CLIENT_KEY') }}"
