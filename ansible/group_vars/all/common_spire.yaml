---
# System Identity
spire_owner: spire
spire_group: spire

# Standard Directory Structure
spire_dir_config: "/etc/spire/server"
spire_dir_data: "/opt/spire/server/data"

# Agent Side: Persisted Identity Directory
spire_agent_dir_data: "/opt/spire/agent/data"

# This variable MUST serve as the canonical release declaration because base_docker_spiffe_helper
# and utils_vault_agent execute across disconnected build-time and runtime environments.
spiffe_helper_version: "0.11.0"
