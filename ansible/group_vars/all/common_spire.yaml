---
# System Identity
spire_owner: spire
spire_group: spire

# Standard Directory Structure
spire_dir_config: "/etc/spire/server"
spire_dir_data: "/opt/spire/server/data"

# Agent Side: Persisted Identity Directory
spire_agent_dir_data: "/opt/spire/agent/data"

# Single source of truth for the spiffe-helper release, since base_docker_spiffe_helper (Packer
# build time) and utils_spire_vault_agent (Terraform runtime) execute in disconnected contexts.
spiffe_helper_version: "0.11.0"
