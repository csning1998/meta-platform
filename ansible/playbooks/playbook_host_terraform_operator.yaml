---
# Executed via ansible-runner or manual tag selection, using ANSIBLE_BECOME_PASS for privilege escalation.
- name: "Play [Setup]: Dynamic Grouping based on node_role"
  hosts: all
  gather_facts: false
  tasks:
    - name: "Create dynamic groups from node_role variable"
      ansible.builtin.group_by:
        key: "{{ node_role | replace('-', '_') }}"
      tags:
        - always

# Phase 2: The SPIRE Agent of this host, a native systemd binary per utils_spire_agent.
- name: "Play [SPIRE Agent]: Provision this host's own SPIRE Agent"
  hosts: "{{ 'host_terraform_operator' if 'host_terraform_operator' in groups else [] }}"
  become: true
  tags:
    - spire_agent
  roles:
    - utils_spire_agent

# Phase 3: Per-consumer Terraform-operator workload identity, consumed by data "external" in
# each replacing layer providers.tf.
- name: "Play [Terraform Operator Identity]: Register JWT-SVID fetch wrapper"
  hosts: "{{ 'host_terraform_operator' if 'host_terraform_operator' in groups else [] }}"
  become: true
  tags:
    - terraform_operator_identity
  vars:
    # The extra_vars of ansible-runner supplies this variable as a JSON-encoded string. A manual
    # run with --tags terraform_operator_identity may instead pass a native YAML list for this
    # variable, or omit the variable entirely.
    _utils_terraform_operator_identity_names_raw: "{{ utils_terraform_operator_identity_names | default([]) }}"
    _utils_terraform_operator_identity_names: >-
      {{ (_utils_terraform_operator_identity_names_raw is string)
        | ternary(_utils_terraform_operator_identity_names_raw | from_json, _utils_terraform_operator_identity_names_raw) }}
    # Maps each identity name to its absolute SPIFFE ID path, supplied in the same JSON-string or native form.
    _utils_terraform_operator_identity_spiffe_paths_raw: >-
      {{ utils_terraform_operator_identity_spiffe_paths | default({}) }}
    _utils_terraform_operator_identity_spiffe_paths: >-
      {{ (_utils_terraform_operator_identity_spiffe_paths_raw is string)
        | ternary(_utils_terraform_operator_identity_spiffe_paths_raw | from_json,
        _utils_terraform_operator_identity_spiffe_paths_raw) }}
  tasks:
    - name: "Register workload identity"
      ansible.builtin.include_role:
        name: utils_terraform_operator_identity
      vars:
        utils_terraform_operator_identity_name: "{{ item }}"
        utils_terraform_operator_identity_spiffe_path: "{{ _utils_terraform_operator_identity_spiffe_paths[item] }}"
      loop: "{{ _utils_terraform_operator_identity_names }}"

# Phase 4: Proves each operator identity end to end, as the operator user without privilege escalation,
# because the sudoers drop-in of the identity is part of the path under test.
- name: "Play [Terraform Operator Verify]: Log in to the Bastion Vault as each operator identity"
  hosts: "{{ 'host_terraform_operator' if 'host_terraform_operator' in groups else [] }}"
  become: false
  gather_facts: false
  tags:
    - terraform_operator_verify
  vars:
    _terraform_operator_verify_names_raw: "{{ utils_terraform_operator_identity_names | default([]) }}"
    _terraform_operator_verify_names: >-
      {{ (_terraform_operator_verify_names_raw is string)
        | ternary(_terraform_operator_verify_names_raw | from_json, _terraform_operator_verify_names_raw) }}
  tasks:
    # A new registration entry reaches the agent on its next sync, and a fetch right after the creation may fail.
    - name: "Step V1. Fetch a JWT-SVID through the wrapper of each identity"
      ansible.builtin.command:
        cmd: "/usr/local/bin/spire-fetch-{{ item }}"
      register: _terraform_operator_verify_jwt
      changed_when: false
      until: _terraform_operator_verify_jwt.rc == 0
      retries: 12
      delay: 5
      no_log: true
      loop: "{{ _terraform_operator_verify_names }}"

    - name: "Step V2. Log in to the Bastion Vault with each JWT-SVID"
      ansible.builtin.uri:
        url: "{{ bastion_vault_endpoint }}/v1/auth/{{ spire_oidc_auth_path }}/login"
        method: POST
        body_format: json
        body:
          role: "{{ item.item }}"
          jwt: "{{ (item.stdout | from_json).jwt }}"
        ca_path: "{{ bastion_vault_ca_cert_path }}"
        validate_certs: true
        return_content: true
      register: _terraform_operator_verify_login
      changed_when: false
      no_log: true
      loop: "{{ _terraform_operator_verify_jwt.results }}"

    - name: "Step V3. Reduce the logins to the policies which they granted"
      ansible.builtin.set_fact:
        _terraform_operator_verify_policies: >-
          {{ _terraform_operator_verify_policies | default({})
            | combine({item.item.item: item.json.auth.policies}) }}
      no_log: true
      loop: "{{ _terraform_operator_verify_login.results }}"

    - name: "Step V4. Assert that each login granted the policy named after its identity"
      ansible.builtin.assert:
        that:
          - item in _terraform_operator_verify_policies[item]
        success_msg: "{{ item }} logged in and holds its own policy"
        fail_msg: "{{ item }} did not receive the policy of the same name"
      loop: "{{ _terraform_operator_verify_names }}"
