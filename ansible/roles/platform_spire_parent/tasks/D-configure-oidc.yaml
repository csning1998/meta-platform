---
- name: "Block D1: OIDC Discovery Provider Directory, Certificate & Service Configuration"
  become: true
  block:
    - name: "D1a. Create OIDC Discovery Provider Config Directory"
      ansible.builtin.file:
        path: "{{ platform_spire_parent_oidc_dir_config }}"
        state: directory
        owner: "{{ spire_owner }}"
        group: "{{ spire_group }}"
        mode: "0750"

    - name: "D1b. Deploy Bastion-issued listener certificate"
      when:
        - vault_server_cert_b64 is defined
        - vault_server_key_b64 is defined
        - vault_ca_cert_b64 is defined
      block:
        - name: "D1b-i. Write server certificate"
          ansible.builtin.copy:
            content: "{{ vault_server_cert_b64 | b64decode }}"
            dest: "{{ platform_spire_parent_oidc_cert_path }}"
            owner: "{{ spire_owner }}"
            group: "{{ spire_group }}"
            mode: "0644"
          notify: Restart SPIRE OIDC Discovery Provider Service

        - name: "D1b-ii. Write server private key"
          ansible.builtin.copy:
            content: "{{ vault_server_key_b64 | b64decode }}"
            dest: "{{ platform_spire_parent_oidc_key_path }}"
            owner: "{{ spire_owner }}"
            group: "{{ spire_group }}"
            mode: "0640"
          notify: Restart SPIRE OIDC Discovery Provider Service

        - name: "D1b-iii. Write PKI CA chain"
          ansible.builtin.copy:
            content: "{{ vault_ca_cert_b64 | b64decode }}"
            dest: "{{ platform_spire_parent_oidc_ca_path }}"
            owner: "{{ spire_owner }}"
            group: "{{ spire_group }}"
            mode: "0644"

    - name: "D1c. Deploy OIDC Discovery Provider Config"
      ansible.builtin.template:
        src: oidc-discovery-provider.conf.j2
        dest: "{{ platform_spire_parent_oidc_dir_config }}/oidc-discovery-provider.conf"
        owner: "{{ spire_owner }}"
        group: "{{ spire_group }}"
        mode: "0640"
      notify: Restart SPIRE OIDC Discovery Provider Service

    - name: "D1d. Create OIDC Discovery Provider Systemd Service"
      ansible.builtin.template:
        src: spire-oidc-discovery-provider.service.j2
        dest: "/etc/systemd/system/spire-oidc-discovery-provider.service"
        owner: root
        group: root
        mode: "0644"
      notify: Restart SPIRE OIDC Discovery Provider Service

  rescue:
    - name: "Block D1: OIDC Discovery Provider Directory, Certificate & Service Configuration failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

- name: "Block D2: Start OIDC Discovery Provider Service"
  become: true
  block:
    - name: "D2a. Enable and start OIDC Discovery Provider"
      ansible.builtin.systemd:
        name: spire-oidc-discovery-provider
        enabled: true
        state: started
        daemon_reload: true

    - name: "D2b. Flush handlers before validation"
      ansible.builtin.meta: flush_handlers

  rescue:
    - name: "Block D2: Start OIDC Discovery Provider Service failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"
