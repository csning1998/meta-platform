---
- name: "Block C1: Initialize Vault Cluster (Primary Only)"
  become: true
  run_once: true
  block:
    - name: "C1a. Wait for Vault"
      ansible.builtin.wait_for:
        port: "{{ vault_port_api }}"
        delay: "{{ platform_vault_vault_wait_delay_seconds }}"

    - name: "C1b. Initialize Vault"
      ansible.builtin.command: >
        vault operator init \
        -key-shares={{ platform_vault_vault_init_key_shares }} \
        -key-threshold={{ platform_vault_vault_init_key_threshold }} \
        -format=json
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_port_api }}"
        VAULT_SKIP_VERIFY: "true"
      register: platform_vault_init_result
      changed_when: platform_vault_init_result.rc == 0
      failed_when:
        - platform_vault_init_result.rc != 0
        - "'Vault is already initialized' not in platform_vault_init_result.stderr"

    - name: "C1c. Fetch Administrative AppRole Credentials"
      community.hashi_vault.vault_kv2_get:
        url: "{{ dev_vault_url }}"
        engine_mount_point: "secret"
        path: "{{ dev_vault_api_path }}"
        validate_certs: true
        ca_cert: "{{ playbook_dir }}/../../vault/tls/ca.pem"
      register: platform_vault_bootstrapper_credentials
      delegate_to: localhost
      become: false

    - name: "C1d. Set AppRole Credentials"
      ansible.builtin.set_fact:
        platform_vault_vault_approle_role_id: "{{ platform_vault_bootstrapper_credentials.secret.role_id }}"
        platform_vault_vault_approle_secret_id: "{{ platform_vault_bootstrapper_credentials.secret.secret_id }}"

    - name: "C1e. Write Merged Secrets back to Vault"
      community.hashi_vault.vault_kv2_write:
        url: "{{ dev_vault_url }}"
        engine_mount_point: "secret"
        path: "{{ dev_vault_api_path }}"
        auth_method: "approle"
        role_id: "{{ platform_vault_vault_approle_role_id }}"
        secret_id: "{{ platform_vault_vault_approle_secret_id }}"
        validate_certs: true
        ca_cert: "{{ playbook_dir }}/../../vault/tls/ca.pem"
        data:
          role_id: "{{ platform_vault_vault_approle_role_id }}"
          secret_id: "{{ platform_vault_vault_approle_secret_id }}"
          prod_vault_root_token: "{{ (platform_vault_init_result.stdout | from_json).root_token }}"
          prod_vault_unseal_keys: "{{ (platform_vault_init_result.stdout | from_json).unseal_keys_b64 }}"
      delegate_to: localhost
      become: false
      when: platform_vault_init_result.rc == 0

  rescue:
    # Preserve ephemeral root token and unseal keys generated by vault operator init.
    # Prevents permanent data loss if downstream credential persistence tasks fail.
    - name: "C1-rescue1. Preserve Vault init secrets if initialization succeeded but persistence failed"
      ansible.builtin.copy:
        content: "{{ platform_vault_init_result.stdout }}"
        dest: "{{ playbook_dir }}/../../vault-init-emergency.json"
        mode: "0600"
      when: platform_vault_init_result is defined and platform_vault_init_result.rc == 0
      no_log: true
      delegate_to: localhost
      become: false

    - name: "Block C1: Initialize Vault Cluster (Primary Only) failed"
      vars:
        _c1_emergency_note: >-
          Vault was newly initialized during this execution but the root token and unseal keys
          could not be persisted to the bootstrap Vault; they have been saved to
          vault-init-emergency.json at the repository root on the Ansible control
          machine (mode 0600). Retrieve them manually, complete the write to the
          bootstrap Vault, then delete that file.
      ansible.builtin.fail:
        msg: >-
          {{ ansible_failed_result.msg | default('see task output above') }}
          {{ _c1_emergency_note if (platform_vault_init_result is defined and platform_vault_init_result.rc == 0) else '' }}
