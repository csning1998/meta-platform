---
- name: "Block A: Run spiffe-helper Container"
  become: true
  block:
    - name: "Step A1. Create spiffe-helper Config Directory"
      ansible.builtin.file:
        path: "{{ utils_spire_vault_agent_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Step A2. Ensure JWT Output Directory Exists"
      ansible.builtin.file:
        path: "{{ utils_spire_vault_agent_jwt_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Step A3. Configure spiffe-helper"
      ansible.builtin.template:
        src: spiffe-helper.conf.j2
        dest: "{{ utils_spire_vault_agent_config_dir }}/spiffe-helper.conf"
        owner: root
        group: root
        mode: "0644"
      register: _utils_spire_vault_agent_helper_conf
      notify: Restart spiffe-helper Container

    # Documentation: documentation/architecture/platform-spire-parent-frontend.md Section 6 Item B.
    - name: "Step A4. Run spiffe-helper Container"
      community.docker.docker_container:
        name: "{{ utils_spire_vault_agent_helper_container_name }}"
        image: "{{ utils_spire_vault_agent_helper_image }}"
        command: ["-config", "/config/spiffe-helper.conf"]
        restart_policy: always
        state: started
        labels:
          spiffe-workload: "{{ spire_cluster_name }}"
        volumes:
          - "{{ utils_spire_vault_agent_socket_dir }}:{{ utils_spire_vault_agent_socket_dir }}:ro"
          - "{{ utils_spire_vault_agent_jwt_dir }}:{{ utils_spire_vault_agent_jwt_dir }}:rw"
          - "{{ utils_spire_vault_agent_config_dir }}/spiffe-helper.conf:/config/spiffe-helper.conf:ro"

    - name: "Step A5. Wait for a JWT-SVID to be issued"
      ansible.builtin.wait_for:
        path: "{{ utils_spire_vault_agent_jwt_dir }}/{{ utils_spire_vault_agent_jwt_file }}"
        timeout: 60
        msg: "Timeout waiting for spiffe-helper to fetch a JWT-SVID."

  rescue:
    - name: "Block A: Run spiffe-helper Container failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

- name: "Block B: Vault Agent Certificate Renewal Setup"
  become: true
  block:
    # Documentation: documentation/architecture/platform-spire-parent-frontend.md Section 7 Item B.
    - name: "Step B1. Deploy Vault CA Certificate"
      ansible.builtin.copy:
        content: "{{ utils_spire_vault_agent_vault_listener_ca_cert_b64 | b64decode }}"
        dest: "{{ utils_spire_vault_agent_config_dir }}/vault-ca.crt"
        owner: "{{ utils_spire_vault_agent_config_owner }}"
        group: "{{ utils_spire_vault_agent_config_group }}"
        mode: "0644"

    - name: "Step B2. Ensure Target Certificate Directory Exists"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ utils_spire_vault_agent_owner }}"
        group: "{{ utils_spire_vault_agent_group }}"
        mode: "{{ utils_spire_vault_agent_cert_mode }}"
      loop: "{{ utils_spire_vault_agent_cert_dirs }}"

    - name: "Step B3. Deploy CA Certificate to Target Location"
      ansible.builtin.copy:
        src: "{{ utils_spire_vault_agent_config_dir }}/vault-ca.crt"
        dest: "{{ utils_spire_vault_agent_cert_base_dir }}/{{ utils_spire_vault_agent_ca_name }}"
        remote_src: true
        owner: "{{ utils_spire_vault_agent_owner }}"
        group: "{{ utils_spire_vault_agent_group }}"
        mode: "0644"

    - name: "Step B4. Configure Vault Agent (vault-agent.hcl)"
      ansible.builtin.template:
        src: vault-agent.hcl.j2
        dest: "{{ utils_spire_vault_agent_config_dir }}/vault-agent.hcl"
        owner: "{{ utils_spire_vault_agent_config_owner }}"
        group: "{{ utils_spire_vault_agent_config_group }}"
        mode: "0640"
      register: _utils_spire_vault_agent_hcl

    - name: "Step B5. Configure Vault Agent Service"
      ansible.builtin.template:
        src: vault-agent.service.j2
        dest: /etc/systemd/system/vault-agent.service
        owner: "{{ utils_spire_vault_agent_service_owner }}"
        group: "{{ utils_spire_vault_agent_service_group }}"
        mode: "0644"
      register: _utils_spire_vault_agent_service

    - name: "Step B6. Enable and Start Vault Agent"
      ansible.builtin.systemd:
        name: vault-agent
        state: started
        enabled: true
        daemon_reload: true

    - name: "Step B7. Restart Vault Agent immediately if config changed"
      ansible.builtin.systemd:
        name: vault-agent
        state: restarted
        daemon_reload: "{{ _utils_spire_vault_agent_service.changed | default(false) }}"
      when: >
        _utils_spire_vault_agent_hcl.changed | default(false) or
        _utils_spire_vault_agent_service.changed | default(false)

    - name: "Step B8. Wait for Certificates to be generated"
      ansible.builtin.wait_for:
        path: "{{ utils_spire_vault_agent_wait_file }}"
        timeout: 60
        msg: "Timeout waiting for Vault Agent to generate certificates."

    - name: "Step B9. Verify Certificate Validity"
      ansible.builtin.command:
        cmd: "openssl x509 -in {{ utils_spire_vault_agent_wait_file }} -noout -checkend 0"
      changed_when: false

  rescue:
    - name: "Block B: Vault Agent Certificate Renewal Setup failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"
