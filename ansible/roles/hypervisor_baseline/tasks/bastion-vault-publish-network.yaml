---
# Defines a dedicated internal network segment for Bastion Vault guest reachability using
# the 172.16.0.0/24 subnet, which remains unallocated by service_catalog due to the
# cidr_index > cidr_nat_offset (124) boundary constraint.
- name: "Define Bastion Vault publish network"
  community.libvirt.virt_net:
    uri: qemu:///system
    command: define
    name: "{{ hypervisor_baseline_publish_network_name }}"
    xml: "{{ lookup('template', 'publish-network.xml.j2') }}"

- name: "Ensure Bastion Vault publish network is active"
  community.libvirt.virt_net:
    uri: qemu:///system
    state: active
    name: "{{ hypervisor_baseline_publish_network_name }}"

- name: "Ensure Bastion Vault publish network autostarts"
  community.libvirt.virt_net:
    uri: qemu:///system
    autostart: true
    name: "{{ hypervisor_baseline_publish_network_name }}"

# Relies on kernel parameters configured in kernel-sysctl.yaml (rp_filter=2 loose mode and ip_forward=1)
# to accommodate asymmetric return path routing across this network segment.
- name: "Open Bastion Vault HTTPS port in the libvirt-routed zone, restricted to this host address"
  ansible.posix.firewalld:
    zone: libvirt-routed
    rich_rule: >-
      rule family="ipv4"
      source address="172.16.0.0/24"
      destination address="{{ hypervisor_baseline_publish_network_address }}"
      port protocol="tcp" port="{{ vault_port_api }}"
      accept
    permanent: true
    state: enabled
  notify: Reload firewalld
