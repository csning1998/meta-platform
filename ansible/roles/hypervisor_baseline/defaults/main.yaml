---
# Resolved once via gather_facts; SUDO_USER indicates the user executing become,
# while USER represents the non-sudo fallback case. There is no single universal source
# for "the operator account" on a local-connection play since ansible_user_id is root once become elevates.
hypervisor_baseline_operator_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"

hypervisor_baseline_libvirtd_socket_dropin_dir: /etc/systemd/system/libvirtd.socket.d

# Divided into target/suffix (shared by query-rule and add-rule commands in mss-clamp.yaml)
# and the differing verb prefixes, centralizing the rule definition in a single location.
hypervisor_baseline_mss_clamp_cidr: 172.16.0.0/16
hypervisor_baseline_mss_clamp_value: "1360"

hypervisor_baseline_mss_clamp_target:
  - ipv4
  - mangle
  - FORWARD
  - "0"

hypervisor_baseline_mss_clamp_suffix:
  - "{{ hypervisor_baseline_mss_clamp_cidr }}"
  - -p
  - tcp
  - --tcp-flags
  - SYN,RST
  - SYN
  - -j
  - TCPMSS
  - --set-mss
  - "{{ hypervisor_baseline_mss_clamp_value }}"

# No RPM repository provides this exporter; the SHA-256 checksum is verified against the release's own
# checksums.txt (github.com/inovex/prometheus-libvirt-exporter/releases/tag/v2.5.0).
hypervisor_baseline_libvirt_exporter_version: "2.5.0"
hypervisor_baseline_libvirt_exporter_sha256: "2bf3714279ce843c898b27fac31da7a7f0706866754e623e2831a4430fcd0469"
hypervisor_baseline_libvirt_exporter_rpm_name: >-
  prometheus-libvirt-exporter-{{ hypervisor_baseline_libvirt_exporter_version }}.amd64.rpm

# Local SELinux policy module which grants virtproxyd search access to the
# libvirt exporter /proc entry. Refer to files/virtproxyd_libvirt_exporter.te.
hypervisor_baseline_selinux_local_dir: /etc/selinux/local
hypervisor_baseline_virtproxyd_policy_module: virtproxyd_libvirt_exporter

# Bastion Vault guest-reachability segment. Lives outside service_catalog:
# cidr_index must exceed cidr_nat_offset (124), leaving octet 0 of
# 172.16.0.0/24 outside the catalog's expressible range.
hypervisor_baseline_publish_network_name: "vault-bastion-publish"
hypervisor_baseline_publish_network_address: "172.16.0.1"
hypervisor_baseline_publish_network_netmask: "255.255.255.0"
