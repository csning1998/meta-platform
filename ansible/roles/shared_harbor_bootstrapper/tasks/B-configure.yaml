---
- name: "B3. Distribute Vault PKI Service CA to OS trust store"
  ansible.builtin.copy:
    content: "{{ vault_ca_cert_b64 | b64decode }}"
    dest: /usr/local/share/ca-certificates/vault-ca.crt
    mode: "0644"
    owner: root
    group: root

- name: "B4. Force update CA certificates before downloading Issuing CA"
  ansible.builtin.command: update-ca-certificates
  changed_when: false

- name: "B5. Download Vault PKI Issuing CA to OS trust store"
  ansible.builtin.get_url:
    url: "{{ vault_endpoint | trim('/') }}/v1/{{ vault_pki_mount_path }}/ca/pem"
    dest: /usr/local/share/ca-certificates/vault-pki-issuing-ca.crt
    mode: "0644"
    owner: root
    group: root
    validate_certs: true

- name: "B6. Discover Harbor UID/GID from existing directory"
  ansible.builtin.stat:
    path: "{{ shared_harbor_bootstrapper_harbor_pki_dir }}"
  register: shared_harbor_bootstrapper_harbor_dir_stat

- name: "B7. Set Harbor ID Facts"
  ansible.builtin.set_fact:
    _shared_harbor_bootstrapper_harbor_uid: >-
      {{ (shared_harbor_bootstrapper_harbor_dir_stat.stat.uid
          if shared_harbor_bootstrapper_harbor_dir_stat.stat.exists
          else shared_harbor_bootstrapper_harbor_uid) | int }}
    _shared_harbor_bootstrapper_harbor_gid: >-
      {{ (shared_harbor_bootstrapper_harbor_dir_stat.stat.gid
          if shared_harbor_bootstrapper_harbor_dir_stat.stat.exists
          else shared_harbor_bootstrapper_harbor_gid) | int }}
