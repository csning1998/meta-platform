---
- name: "Block D1: Unseal Primary Node"
  become: true
  when: inventory_hostname in groups['primary']
  block:
    - name: "D1a. Check Current Vault Status"
      ansible.builtin.command: vault status -format=json
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_port_api }}"
        VAULT_SKIP_VERIFY: "true"
      register: shared_vault_vault_status_check
      changed_when: false
      failed_when: false

    - name: "D1b. Fetch Administrative AppRole Credentials"
      community.hashi_vault.vault_kv2_get:
        url: "{{ dev_vault_url }}"
        engine_mount_point: "secret"
        path: "{{ dev_vault_api_path }}"
        validate_certs: true
        ca_cert: "{{ playbook_dir }}/../../vault/tls/ca.pem"
      register: shared_vault_bootstrapper_credentials
      delegate_to: localhost
      become: false
      when:
        - shared_vault_vault_status_check.rc == 2
        - shared_vault_vault_status_check.stdout | length > 0
        - (shared_vault_vault_status_check.stdout | from_json).sealed
      no_log: true

    - name: "D1c. Set AppRole Credentials"
      ansible.builtin.set_fact:
        shared_vault_vault_approle_role_id: "{{ shared_vault_bootstrapper_credentials.secret.role_id }}"
        shared_vault_vault_approle_secret_id: "{{ shared_vault_bootstrapper_credentials.secret.secret_id }}"
      when: shared_vault_bootstrapper_credentials is not skipped
      no_log: true

    - name: "D1d. Fetch Unseal Keys from Bootstrap Vault"
      community.hashi_vault.vault_kv2_get:
        url: "{{ dev_vault_url }}"
        engine_mount_point: "secret"
        path: "{{ dev_vault_api_path }}"
        auth_method: "approle"
        role_id: "{{ shared_vault_vault_approle_role_id }}"
        secret_id: "{{ shared_vault_vault_approle_secret_id }}"
        validate_certs: true
        ca_cert: "{{ playbook_dir }}/../../vault/tls/ca.pem"
      register: shared_vault_unseal_secrets
      delegate_to: localhost
      become: false
      when:
        - shared_vault_vault_status_check.rc == 2
        - shared_vault_vault_status_check.stdout | length > 0
        - (shared_vault_vault_status_check.stdout | from_json).sealed
      no_log: true

    - name: "D1e. Parse Unseal Keys"
      ansible.builtin.set_fact:
        shared_vault_vault_unseal_keys: "{{ shared_vault_unseal_secrets.secret.prod_vault_unseal_keys }}"
      when: shared_vault_unseal_secrets is not skipped
      no_log: true

    - name: "D1f. Execute Unseal"
      ansible.builtin.command: "vault operator unseal {{ item }}"
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_port_api }}"
        VAULT_SKIP_VERIFY: "true"
      loop: "{{ shared_vault_vault_unseal_keys[: shared_vault_vault_init_key_threshold | int] }}"
      register: shared_vault_unseal_result
      changed_when: "'Sealed: false' in shared_vault_unseal_result.stdout"
      when: shared_vault_vault_unseal_keys is defined
      no_log: true

  rescue:
    - name: "Block D1: Unseal Primary Node failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

- name: "Block D2: Raft Join and Unseal Replica Nodes"
  become: true
  when: inventory_hostname in groups['replica']
  block:
    - name: "D2a. Wait for Vault to become Initialized (Raft Join)"
      ansible.builtin.command: vault status -format=json
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_port_api }}"
        VAULT_SKIP_VERIFY: "true"
      register: shared_vault_vault_init_check
      until:
        - shared_vault_vault_init_check.rc in [0, 2]
        - shared_vault_vault_init_check.stdout | length > 0
        - (shared_vault_vault_init_check.stdout | from_json).initialized
      retries: "{{ shared_vault_vault_unseal_retries }}"
      delay: "{{ shared_vault_vault_unseal_delay_seconds }}"
      changed_when: false
      failed_when: shared_vault_vault_init_check.rc not in [0, 2]

    - name: "D2b. Fetch Administrative AppRole Credentials"
      community.hashi_vault.vault_kv2_get:
        url: "{{ dev_vault_url }}"
        engine_mount_point: "secret"
        path: "{{ dev_vault_api_path }}"
        validate_certs: true
        ca_cert: "{{ playbook_dir }}/../../vault/tls/ca.pem"
      register: shared_vault_bootstrapper_credentials
      delegate_to: localhost
      become: false
      when:
        - shared_vault_vault_init_check.rc == 2
        - shared_vault_vault_init_check.stdout | length > 0
        - (shared_vault_vault_init_check.stdout | from_json).sealed
      no_log: true

    - name: "D2c. Set AppRole Credentials"
      ansible.builtin.set_fact:
        shared_vault_vault_approle_role_id: "{{ shared_vault_bootstrapper_credentials.secret.role_id }}"
        shared_vault_vault_approle_secret_id: "{{ shared_vault_bootstrapper_credentials.secret.secret_id }}"
      when: shared_vault_bootstrapper_credentials is not skipped
      no_log: true

    - name: "D2d. Fetch Unseal Keys from Bootstrap Vault"
      community.hashi_vault.vault_kv2_get:
        url: "{{ dev_vault_url }}"
        engine_mount_point: "secret"
        path: "{{ dev_vault_api_path }}"
        auth_method: "approle"
        role_id: "{{ shared_vault_vault_approle_role_id }}"
        secret_id: "{{ shared_vault_vault_approle_secret_id }}"
        validate_certs: true
        ca_cert: "{{ playbook_dir }}/../../vault/tls/ca.pem"
      register: shared_vault_unseal_secrets
      delegate_to: localhost
      become: false
      when: shared_vault_bootstrapper_credentials is not skipped
      no_log: true

    - name: "D2e. Parse Unseal Keys"
      ansible.builtin.set_fact:
        shared_vault_vault_unseal_keys: "{{ shared_vault_unseal_secrets.secret.prod_vault_unseal_keys }}"
      when: shared_vault_unseal_secrets is not skipped
      no_log: true

    - name: "D2f. Execute Unseal"
      ansible.builtin.command: "vault operator unseal {{ item }}"
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_port_api }}"
        VAULT_SKIP_VERIFY: "true"
      loop: "{{ shared_vault_vault_unseal_keys[: shared_vault_vault_init_key_threshold | int] }}"
      register: shared_vault_unseal_result
      changed_when: "'Sealed: false' in shared_vault_unseal_result.stdout"
      when: shared_vault_vault_unseal_keys is defined
      no_log: true

  rescue:
    - name: "Block D2: Raft Join and Unseal Replica Nodes failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

- name: "Block D3: Verify Vault Cluster Availability"
  become: true
  when:
    - inventory_hostname in groups['primary']
    - vault_vip is defined
    - vault_ca_cert_b64 is defined
  block:
    - name: "D3a0. Create temporary CA file for health check"
      ansible.builtin.tempfile:
        state: file
        suffix: .crt
      register: shared_vault_vault_health_ca_file
      delegate_to: localhost
      become: false

    - name: "D3a1. Write Vault CA to temp file"
      ansible.builtin.copy:
        content: "{{ vault_ca_cert_b64 | b64decode }}"
        dest: "{{ shared_vault_vault_health_ca_file.path }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: "D3a. Wait for Vault VIP to be Active (200 OK)"
      ansible.builtin.uri:
        url: "https://{{ vault_vip }}:443/v1/sys/health"
        validate_certs: true
        ca_path: "{{ shared_vault_vault_health_ca_file.path }}"
        status_code: 200
      register: shared_vault_health_check
      until: shared_vault_health_check.status == 200
      retries: 60
      delay: 2
      delegate_to: localhost
      become: false

  rescue:
    - name: "Block D3: Verify Vault Cluster Availability failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

  always:
    - name: "D3b. Clean up temporary Vault CA file"
      ansible.builtin.file:
        path: "{{ shared_vault_vault_health_ca_file.path }}"
        state: absent
      when:
        - inventory_hostname in groups['primary']
        - shared_vault_vault_health_ca_file is defined
        - shared_vault_vault_health_ca_file.path is defined
      delegate_to: localhost
      become: false
